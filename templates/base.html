<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="CineSentiment AI - Análisis inteligente de sentimientos de reseñas cinematográficas">

    <title>{% block title %}CineSentiment AI{% endblock %}</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='estilos.css') }}">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<header class="navbar">

    <a href="{{ url_for('inicio') }}" class="logo">
        <i class="bi bi-film"></i>
        <span>CineSentiment <strong>AI</strong></span>
    </a>

    <button class="menu-toggle" id="menuToggle"
            type="button" aria-label="Abrir menú">
        <i class="bi bi-list"></i>
    </button>

    <nav class="nav-links" id="navLinks">
        <a href="{{ url_for('inicio') }}">
            <i class="bi bi-house-door"></i> Inicio
        </a>

        <a href="{{ url_for('analisis') }}">
            <i class="bi bi-cpu"></i> Análisis
        </a>

        <a href="{{ url_for('resultados') }}">
            <i class="bi bi-bar-chart-line"></i> Resultados
        </a>

        <a href="{{ url_for('analisis') }}" class="nav-button">
            Comenzar <i class="bi bi-arrow-right"></i>
        </a>
    </nav>

</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <div class="footer-content">
        <h3><i class="bi bi-film"></i> CineSentiment AI</h3>
        <p>Inteligencia artificial aplicada al análisis de sentimientos cinematográficos.</p>
        <p>Proyecto académico | Python · Flask · Machine Learning</p>
        <small>© 2026 CineSentiment AI. Todos los derechos reservados.</small>
    </div>
</footer>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>

</body>
</html>
